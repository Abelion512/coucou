[package]
name = "coucou-hook"
description = "Relays Claude Code hook events to Coucou over a named pipe"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "coucou-hook"
path = "src/main.rs"

[dependencies]
serde_json = "1"

# getuid + SO_PEERCRED: who we are, and who is listening on the socket.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
