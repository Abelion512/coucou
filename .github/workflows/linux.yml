name: Linux

# Builds and tests the Linux app. Publishes the .deb and AppImage on `linux-v*`
# tags. Pull requests that touch the app build and test but publish nothing.

on:
  push:
    tags:
      - 'linux-v*'
    branches:
      - main
  workflow_dispatch:
  # Build and test only, like the Windows workflow upstream added (#89): a pull
  # request never publishes, and a fork's token is read-only anyway.
  pull_request:
    paths:
      - 'app/**'
      - 'shared/**'
      - 'scripts/**'
      - '.github/workflows/linux.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good

      - uses: oven-sh/setup-bun@v2

      - name: Restore cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app/target
          key: linux-cargo-${{ hashFiles('app/Cargo.lock') }}
          restore-keys: linux-cargo-

      - name: Frontend build (bun)
        run: bun install --frozen-lockfile && bun run build

      - name: Rust tests
        run: |
          cargo test -p coucou-hook
          cargo test -p coucou --lib

      # The version lives in three files and a tag. A release published under the
      # wrong number is the failure nobody notices until a bug report contradicts
      # it, so it is checked before anything is built.
      #
      # These two steps run from the repository root, not from `app`: they check
      # files outside the workspace directory, and `working-directory: app` above
      # applies to every step unless a step says otherwise. Both used to fail
      # with "No such file or directory" — the workflow was green nowhere.
      - name: Version is consistent
        working-directory: ${{ github.workspace }}
        run: ./scripts/version.sh check

      - name: DEBT sweep (advisory)
        working-directory: ${{ github.workspace }}
        run: ./scripts/auto_ponytail.sh --quiet

      - name: Build bundles (.deb + AppImage)
        if: startsWith(github.ref, 'refs/tags/linux-v')
        env:
          TAURI_SIGNING_PRIVATE_KEY: ''
        run: |
          cargo build --release -p coucou-hook
          bunx tauri build

      - name: Release
        if: startsWith(github.ref, 'refs/tags/linux-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/target/release/bundle/deb/*.deb
            app/target/release/bundle/appimage/*.AppImage
